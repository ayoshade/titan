# Titan tmux defaults. This copy belongs to you; updates never overwrite it.
set -g prefix C-b
set -g prefix2 C-Space
bind C-Space send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-kitty:RGB:clipboard'
setw -g mode-keys vi
bind v split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind r source-file '@@CONFIG@@/tmux/tmux.conf' \; display-message 'Titan tmux configuration reloaded'
set -g status-position top
set -g status-left ' #S '
set -g status-right ' #{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#H '
set -g status-style 'bg=default,fg=white'
set -g pane-border-style 'fg=brightblack'
source-file -q '@@GENERATED@@/tmux.conf'
