font_family JetBrains Mono
font_size 11
cursor_shape beam
window_padding_width 18
hide_window_decorations yes
background_opacity 0.92
confirm_os_window_close 0
enable_audio_bell no
linux_display_server wayland
# Generated palette colours (apply-theme), then the user's overrides.
include ~/.local/state/titan/generated/kitty-theme.conf
include ~/.config/titan/kitty.conf
