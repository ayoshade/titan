general {
 hide_cursor = true
 immediate_render = true
}
background {
 monitor =
 color = rgba(08090bff)
}
label {
 monitor =
 text = $TIME
 color = rgba(e2e4e8ff)
 font_size = 64
 font_family = Inter
 position = 0, 100
 halign = center
 valign = center
}
label {
 monitor =
 text = U M B R A  /  ACCESS RESTRICTED
 color = rgba(8b929bff)
 font_size = 12
 font_family = JetBrains Mono
 position = 0, 35
 halign = center
 valign = center
}
input-field {
 monitor =
 size = 280, 48
 outline_thickness = 1
 dots_size = 0.22
 dots_spacing = 0.3
 outer_color = rgba(353b44ff)
 inner_color = rgba(111318ff)
 font_color = rgba(e2e4e8ff)
 check_color = rgba(8b929bff)
 fail_color = rgba(c48787ff)
 placeholder_text = Authenticate
 fade_on_empty = false
 rounding = 8
 position = 0, -60
 halign = center
 valign = center
}

# Explains a pam_faillock lockout, which Hyprlock reports only as a failure.
label {
 monitor =
 text = cmd[update:2000] "${TITAN_ROOT:-$HOME/dotfiles}/scripts/lock-status"
 color = rgba(c48787ff)
 font_size = 11
 font_family = Inter
 position = 0, -115
 halign = center
 valign = center
}

animations {
 enabled = false
}
